name: Production benchmark
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: opcache
        coverage: none
    - name: Install development benchmark tools
      run: sudo apt-get update -qq && sudo apt-get install -y nginx php8.5-fpm
    - run: composer install --prefer-dist --no-progress --no-interaction
    - name: Verify complete production requests
      shell: bash
      run: |
        set -o pipefail
        bash CorianderCore/Tests/benchmarks/run-production.sh | tee benchmark-production.json
    - uses: actions/upload-artifact@v4
      with:
        name: production-benchmark
        path: benchmark-production.json
