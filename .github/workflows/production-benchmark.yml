name: Production benchmark
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: opcache
        coverage: none
    - name: Install development benchmark tools
      run: sudo apt-get update -qq && sudo apt-get install -y nginx php8.3-fpm
    - run: composer install --prefer-dist --no-progress --no-interaction
    - name: Check out the pre-routing baseline
      uses: actions/checkout@v7
      with:
        ref: 72fff84956f0a22eb65eb9eb81aa1f59c746a40a
        path: benchmark-baseline
    - name: Install baseline benchmark dependencies
      run: composer install --working-dir=benchmark-baseline --prefer-dist --no-progress --no-interaction
    - name: Verify equivalent baseline requests on the same runner
      shell: bash
      run: |
        set -o pipefail
        (cd benchmark-baseline && bash CorianderCore/Tests/benchmarks/run-production.sh) | tee benchmark-production-baseline.json
    - name: Verify complete production requests
      shell: bash
      run: |
        set -o pipefail
        bash CorianderCore/Tests/benchmarks/run-production.sh | tee benchmark-production.json
    - uses: actions/upload-artifact@v7
      with:
        name: production-benchmark
        path: benchmark-production*.json
